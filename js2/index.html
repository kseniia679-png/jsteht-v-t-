<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Tehtävät</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
            line-height: 1.6;
        }
        h2 {
            color: #333;
        }
        .task {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        code {
            background: #eee;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h1>Ohjelmoinnin perusteet – Tehtävät</h1>

    <!-- Tehtävä 1 -->
    <div class="task">
        <h2>Tehtävä 1: Muuttujat ja merkkijonopohja</h2>
        <p id="task1"></p>
    </div>

    <!-- Tehtävä 2 -->
    <div class="task">
        <h2>Tehtävä 2: Ostoskori</h2>
        <p id="task2"></p>
    </div>

    <!-- Tehtävä 3 -->
    <div class="task">
        <h2>Tehtävä 3: let vs const</h2>
        <p id="task3"></p>
        <p id="task3error"></p>
    </div>

    <!-- Tehtävä 4 -->
    <div class="task">
        <h2>Tehtävä 4: Tyyppien tutkiminen</h2>
        <p id="task4"></p>
    </div>

    <script>
        // Tehtävä 1
        let etunimi = "Aino";
        let ika = 21;
        let kaupunki = "Oulu";
        document.getElementById("task1").textContent = `Olen ${etunimi}, ${ika} vuotta, ${kaupunki}sta.`;

        // Tehtävä 2
        let hinta1 = 3.50;
        let hinta2 = 5.20;
        let hinta3 = 3.70;
        let yhteissumma = hinta1 + hinta2 + hinta3;
        document.getElementById("task2").textContent = `Yhteensä: ${yhteissumma.toFixed(2)} €`;

        // Tehtävä 3
        let laskuri = 0;
        let tulos = "";
        laskuri++;
        tulos += `Kasvatus 1: ${laskuri} | `;
        laskuri++;
        tulos += `Kasvatus 2: ${laskuri} | `;
        laskuri++;
        tulos += `Kasvatus 3: ${laskuri}`;
        document.getElementById("task3").textContent = tulos;

        // const-laskuri selitys
        document.getElementById("task3error").textContent = 
            "Jos laskuri olisi määritelty const:lla, sen arvoa ei voisi muuttaa. " +
            "Selaimen konsolissa tulisi TypeError: 'Assignment to constant variable', " +
            "koska const-muuttuja on vakio.";

        // Tehtävä 4
        let tyyppiTulos = "";
        tyyppiTulos += `typeof 42 = ${typeof 42} | `;
        tyyppiTulos += `typeof "Hei" = ${typeof "Hei"} | `;
        tyyppiTulos += `typeof true = ${typeof true} | `;
        tyyppiTulos += `typeof null = ${typeof null} | `;
        tyyppiTulos += `typeof undefined = ${typeof undefined} | `;
        tyyppiTulos += `"5" * 2 = ${"5" * 2} | `;
        tyyppiTulos += `"5" + 2 = ${"5" + 2} | `;
        tyyppiTulos += `Number("abc") = ${Number("abc")}`;
        document.getElementById("task4").textContent = tyyppiTulos;
    </script>
